name: teamo
version: 0.13.0+13
description: اپلیکیشن فارسی مدیریت تیم، پروژه، جلسات، اسکرام و PMO.
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.1
  path: ^1.9.1
  shamsi_date: ^1.1.1
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/teamo_icon.png
    - assets/teamo_logo.png

flutter_launcher_icons:
  android: true
  image_path: assets/teamo_icon.png
  min_sdk_android: 23
  adaptive_icon_background: '#F7F8FC'
  adaptive_icon_foreground: assets/teamo_icon.png
